<section id="hero" class="hero-v2" data-scroll-target="works" data-scroll-href="{{SCROLL_HREF}}" data-cta-href="{{CTA_HREF}}" data-hero-words="{{HERO_WORDS_JSON}}" lang="{{HERO_LANG}}" aria-labelledby="hero-v2-headline">
  <div class="hero-v2-inner">
    <div
      class="hero-v2-headline"
      id="hero-v2-headline"
      role="heading"
      aria-level="1"
    >
      <span class="hero-v2-line1">
        <span class="hero-v2-static">{{HERO_STATIC}}</span>
        <span class="hero-v2-word-box" id="hero-v2-wb">
          <span class="hero-v2-word" id="hero-v2-wa">{{HERO_WORD_INITIAL}}</span>
        </span>
      </span>
      <span class="hero-v2-suffix">{{HERO_SUFFIX}}</span>
    </div>
    <a href="{{CTA_HREF}}" class="hero-v2-mobile-cta btn btn--fill" lang="{{HERO_LANG}}">{{MOBILE_CTA}}</a>
    <a href="{{CTA_HREF}}" class="hero-v2-a11y-link site-footer-sr-only hero-v2-skip-when-mobile">
      {{MOBILE_CTA_A11Y}}
    </a>
  </div>
  <div id="hero-v2-cursor" class="hero-v2-cursor" lang="{{HERO_LANG}}" aria-hidden="true" role="presentation">
    <div class="hero-v2-cursor__btn">
      <span class="hero-v2-cursor__label">{{CURSOR_LABEL}}</span>
    </div>
  </div>
</section>
