<section id="hero" class="hero-v2 hero-v2--static" data-scroll-target="works" data-scroll-href="{{SCROLL_HREF}}" data-cta-href="{{CTA_HREF}}" lang="{{HERO_LANG}}" aria-labelledby="hero-v2-headline">
  <div class="hero-v2-inner">
    <div
      class="hero-v2-headline"
      id="hero-v2-headline"
      role="heading"
      aria-level="1"
    >
      <span class="hero-v2-accent">{{HERO_LINE1}}</span>
      {{HERO_LINE2_HTML}}
    </div>
    <a href="{{CTA_HREF}}" class="hero-v2-mobile-cta btn btn--fill" lang="{{HERO_LANG}}">{{MOBILE_CTA}}</a>
    <a href="{{CTA_HREF}}" class="hero-v2-a11y-link site-footer-sr-only hero-v2-skip-when-mobile">
      {{MOBILE_CTA_A11Y}}
    </a>
  </div>
  <div id="hero-v2-cursor" class="hero-v2-cursor" lang="{{HERO_LANG}}" aria-hidden="true" role="presentation">
    <div class="hero-v2-cursor__btn">
      <span class="hero-v2-cursor__label">{{CURSOR_LABEL}}</span>
    </div>
  </div>
</section>
